name: Publish npm Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag matching the package version (for example v0.2.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-npm-package
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          PRERELEASE: ${{ github.event.release.prerelease || false }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (pkg.name !== 'webnim' || process.env.RELEASE_TAG !== `v${pkg.version}`)
            throw new Error('Release tag must match webnim package version');
          const tag = process.env.PRERELEASE === 'true' || pkg.version.includes('-') ? 'next' : 'latest';
          fs.appendFileSync(process.env.GITHUB_ENV, `NPM_DIST_TAG=${tag}\n`);
          JS
      - name: Use npm with trusted publishing support
        run: npm install --global npm@11
      - run: npm ci
      - run: npm test
      - run: npm run test:package
      - name: Publish to npm using trusted publishing
        run: npm publish --registry=https://registry.npmjs.org --access=public --tag "$NPM_DIST_TAG"
